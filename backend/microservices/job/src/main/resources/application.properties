spring.application.name=job
server.port=8082

#DataSource - MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/job_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA
# The schema is created by database/job_db.sql, so Hibernate does not touch it.
# Use "update" instead if you want Hibernate to create/alter the tables itself.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

#Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ============================================================
# Atelier Eureka : enregistrement aupres du serveur Eureka
# ============================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ============================================================
# Atelier Actuator : observabilite
# ============================================================
# Exposer les endpoints health, info, metrics et loggers (seul health l'est par defaut)
management.endpoints.web.exposure.include=health,info,metrics,loggers
# Afficher le detail des composants dans /health (db, diskSpace, ping...)
management.endpoint.health.show-details=always
# Transmettre a Eureka le statut de /health (le service passe DOWN si un composant tombe)
eureka.client.healthcheck.enabled=true
# Publier les proprietes info.* dans /actuator/info (desactive par defaut)
management.info.env.enabled=true

# Contenu affiche par /actuator/info
info.app.name=job
info.app.version=1.0.0
info.app.description=Microservice de gestion des offres
info.app.team=Molka Jebali, Zeineb Arfaoui
