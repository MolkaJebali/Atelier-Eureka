spring.application.name=candidat
server.port=8081
#H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2
#DataSource
spring.datasource.username=Badia
spring.datasource.password=
spring.datasource.url=jdbc:h2:mem:candidat;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create

#Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ============================================================
# Atelier Eureka : enregistrement aupres du serveur Eureka
# ============================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ============================================================
# Atelier Actuator : observabilite
# ============================================================
# Exposer les endpoints health, info, metrics et loggers (seul health l'est par defaut)
management.endpoints.web.exposure.include=health,info,metrics,loggers
# Afficher le detail des composants dans /health (db, diskSpace, ping...)
management.endpoint.health.show-details=always
# Transmettre a Eureka le statut de /health (le service passe DOWN si un composant tombe)
eureka.client.healthcheck.enabled=true
# Publier les proprietes info.* dans /actuator/info (desactive par defaut)
management.info.env.enabled=true

# Contenu affiche par /actuator/info
info.app.name=candidat
info.app.version=1.0.0
info.app.description=Microservice de gestion des candidats
info.app.team=Molka Jebali, Zeineb Arfaoui
